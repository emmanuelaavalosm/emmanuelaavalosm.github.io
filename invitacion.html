<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
    }

    video {
        width: 100%;
        max-width: 900px;
        height: auto;
        display: block;
    }

    .boton {
        display: none;
        margin-top: 20px;
        padding: 14px 28px;
        background: #ffffff;
        color: #000000;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 30px;
        transition: 0.2s;
    }

    .boton:hover {
        transform: scale(1.05);
    }
</style>
```

</head>

<body>

```
<video id="video" autoplay muted playsinline>
    <source src="vid/video.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
</video>

<a
    id="boton"
    class="boton"
    href="https://maps.app.goo.gl/DSR4ypNYeCqg2TqX8"
    target="_blank"
>
    Ir a la ubicación
</a>

<script>
    const video = document.getElementById("video");
    const boton = document.getElementById("boton");

    video.addEventListener("ended", function () {
        boton.style.display = "block";
    });
</script>
```

</body>
</html>
